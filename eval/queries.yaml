# Retrieval evaluation set.
#
# Relevance is defined by explicit rules over recipe metadata, NOT by looking
# at what any retriever returns (avoids biasing the benchmark towards one
# system). Rules are resolved into qrels by eval/build_qrels.py.
#
#   relevant: grade 2 - exactly what the user asked for
#   partial:  grade 1 - acceptable substitute (same dish family / cuisine)
#
# Rule fields (all optional, combined with AND):
#   name       regex matched against the recipe title (case-insensitive)
#   ing        list of regexes; EACH must match one of the ingredients
#   moroccan   true/false
#   vegetarian / vegan / gluten_free: true
#   max_minutes / max_calories: numeric limits (recipe must have the value)
#
# Categories:
#   moroccan_fr    Moroccan dish asked in French
#   darija         Darija / transliterated spelling (tanjia, bstilla, ...)
#   intl_en        international dish asked in English
#   intl_fr        international dish asked in French (cross-lingual)
#   ingredients    "what can I cook with X, Y, Z"
#   constraints    diet / time / calorie constraints
#   unanswerable   in-domain but not in the corpus, or off-topic
#                  (no qrels: used for abstention / confidence calibration)

queries:
